<text x="28" y="438" font-size="11.5" fill="#5f6b78">Sentinel failover 창은 약 3.4초다. 서킷이 열린 동안의 요청은 큐잉하지 않고 Retry-After 헤더와 함께 503으로 즉시 반환한다.</text>
<text x="28" y="457" font-size="11.5" fill="#5f6b78">예외 매핑이 없으면 같은 장애가 500으로 노출된다. 조정의 효과는 실패 총량이 아니라 실패 종류의 변화로 나타난다.</text>
