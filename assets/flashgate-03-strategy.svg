<text x="28" y="424" font-size="11.5" fill="#5f6b78">Redisson의 지연 수치는 절반이 락 획득에 실패해 503으로 떨어진 뒤 남은 요청만 측정된 값이다. 경합이 지연이 아니라 실패율로 전이한다.</text>
<text x="28" y="443" font-size="11.5" fill="#5f6b78">Sentinel을 경유한 Lua는 직접 연결보다 p95 기준 12배 느리다. Lua의 이점은 이 구간을 제거한 뒤에야 측정 가능하며, 원인 분석은 진행 중이다.</text>
