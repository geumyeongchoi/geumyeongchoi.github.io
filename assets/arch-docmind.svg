<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="docmind — 근거가 없으면 답하지 않는다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f4fd1"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs>
<rect width="940" height="470" fill="#ffffff"/>
<text x="28" y="32" font-size="16.5" font-weight="650" fill="#16202b">docmind — 근거가 없으면 답하지 않는다</text>
<text x="28" y="53" font-size="12.5" fill="#5f6b78">검색된 문서에 섞여 들어온 '모델에게 내리는 지시'를 입력과 출력 두 곳에서 걷어낸다.</text>
<rect x="28" y="96" width="122" height="62" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<text x="89.0" y="125.5" font-size="12.5" font-weight="650" fill="#16202b" text-anchor="middle">질문</text>
<text x="89.0" y="141.0" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">SSE 연결</text>
<line x1="150" y1="127" x2="190" y2="127" stroke="#1f4fd1" stroke-width="1.4" marker-end="url(#ab)"/>
<rect x="190" y="96" width="210" height="62" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<rect x="190" y="96" width="3.5" height="62" rx="1.75" fill="#1f4fd1"/>
<text x="295.0" y="117.8" font-size="12.5" font-weight="650" fill="#16202b" text-anchor="middle">하이브리드 검색</text>
<text x="295.0" y="133.2" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">pgvector ∥ tsvector</text>
<text x="295.0" y="148.8" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">RRF k=60 · topK 6</text>
<line x1="400" y1="127" x2="440" y2="127" stroke="#1f4fd1" stroke-width="1.4" marker-end="url(#ab)"/>
<rect x="440" y="96" width="214" height="62" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<rect x="440" y="96" width="3.5" height="62" rx="1.75" fill="#9a6700"/>
<text x="547.0" y="117.5" font-size="12" font-weight="650" fill="#16202b" text-anchor="middle">1단 — 컨텍스트 중화</text>
<text x="547.0" y="133.0" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">청크를 문장 단위로 훑어</text>
<text x="547.0" y="148.5" font-size="10.5" font-weight="400" fill="#9a6700" text-anchor="middle">지시문만 치환, 정상 문장은 보존</text>
<line x1="654" y1="127" x2="694" y2="127" stroke="#1f4fd1" stroke-width="1.4" marker-end="url(#ab)"/>
<rect x="694" y="96" width="218" height="62" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<text x="803.0" y="117.8" font-size="12.5" font-weight="650" fill="#16202b" text-anchor="middle">LLM</text>
<text x="803.0" y="133.2" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">Ollama / OpenAI / Anthropic</text>
<text x="803.0" y="148.8" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">프로파일로 전환</text>
<line x1="803" y1="170" x2="803" y2="206" stroke="#1f4fd1" stroke-width="1.4" marker-end="url(#ab)"/>
<rect x="590" y="206" width="322" height="66" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<rect x="590" y="206" width="3.5" height="66" rx="1.75" fill="#9a6700"/>
<text x="751.0" y="229.5" font-size="12" font-weight="650" fill="#16202b" text-anchor="middle">2단 — 출력 후처리</text>
<text x="751.0" y="245.0" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">제거한 지시문과 12자 이상 일치 · 미끼 값 · 금지 문구</text>
<text x="751.0" y="260.5" font-size="10.5" font-weight="400" fill="#9a6700" text-anchor="middle">걸리면 누적 토큰을 버리고 대체 문구로</text>
<line x1="590" y1="239" x2="550" y2="239" stroke="#1f4fd1" stroke-width="1.4" marker-end="url(#ab)"/>
<rect x="330" y="206" width="220" height="66" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<text x="440.0" y="237.5" font-size="12" font-weight="650" fill="#16202b" text-anchor="middle">SSE 스트리밍</text>
<text x="440.0" y="252.5" font-size="10" font-weight="400" fill="#8b95a1" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">citations → token* → (redact) → done</text>
<line x1="330" y1="239" x2="290" y2="239" stroke="#1f4fd1" stroke-width="1.4" marker-end="url(#ab)"/>
<rect x="28" y="206" width="262" height="66" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<rect x="28" y="206" width="3.5" height="66" rx="1.75" fill="#1f4fd1"/>
<text x="159.0" y="237.2" font-size="12" font-weight="650" fill="#16202b" text-anchor="middle">답변 + 출처 카드</text>
<text x="159.0" y="252.8" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">클릭하면 원문 뷰어에서 해당 청크 강조</text>
<rect x="28" y="306" width="292" height="58" rx="9" fill="#fbfcfd" stroke="#d7dde5" stroke-width="1"/>
<text x="174.0" y="333.5" font-size="12.5" font-weight="650" fill="#16202b" text-anchor="middle">정답 포함률 43% → 76.7%</text>
<text x="174.0" y="349.0" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">프롬프트 v1→v4 회귀 평가 (30문항)</text>
<rect x="332" y="306" width="292" height="58" rx="9" fill="#fbfcfd" stroke="#d7dde5" stroke-width="1"/>
<text x="478.0" y="333.5" font-size="12.5" font-weight="650" fill="#16202b" text-anchor="middle">인용 정확률 95.6%</text>
<text x="478.0" y="349.0" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">문서 34종 50문항 · 무작위 기대값 ≈17%</text>
<rect x="636" y="306" width="292" height="58" rx="9" fill="#fbfcfd" stroke="#d7dde5" stroke-width="1"/>
<text x="782.0" y="333.5" font-size="12.5" font-weight="650" fill="#16202b" text-anchor="middle">인젝션 문항 100% 방어</text>
<text x="782.0" y="349.0" font-size="10.5" font-weight="400" fill="#8b95a1" text-anchor="middle">미끼 값 admin1234 어느 답변에도 미노출</text>
<rect x="28" y="380" width="884" height="44" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>
<rect x="28" y="380" width="3.5" height="44" rx="1.75" fill="#0a7a0a"/>
<text x="470.0" y="407.8" font-size="11.5" font-weight="400" fill="#5f6b78" text-anchor="middle">근거가 없으면 "제공된 문서에서 찾지 못했습니다"로 끝낸다 — 문서에 없는 것을 지어내지 않는 것이 이 프로젝트의 기본 계약이다.</text>
<text x="28" y="454" font-size="11" fill="#8b95a1">저장소 github.com/geumyeongchoi/docmind · 평가 재현 ./gradlew eval</text>
</svg>